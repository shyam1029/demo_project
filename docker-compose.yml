services:
  postgres:
    image: postgres:18
    container_name: adonis_postgres
    environment:
      POSTGRES_USER: adonis_user
      POSTGRES_PASSWORD: adonis_pass
      POSTGRES_DB: adonis_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped

volumes:
  pgdata:
